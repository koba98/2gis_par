# Запуск на сервере.
#   Весь Казахстан по волнам — два воркера конвейером на одном плане в БД:
#     docker compose up -d kz kz-http    # логи: docker compose logs -f kz kz-http
#     docker compose run --rm parser plan    # что уже выполнено
#     docker compose run --rm parser stats   # полнота: заявлено 2ГИС / собрано по городам
#   Разовая команда:  docker compose run --rm parser catalog -r Астана
#
# kz      — браузер: транспорт, каталог (листание выдачи кликами), добор.
# kz-http — без браузера: «В здании», карточки и отзывы (HTTP-запросы, 3 параллельно, общий
#           адаптивный темп). Пока kz листает каталог следующего города, kz-http дособирает
#           карточки предыдущего. Chrome в kz-http запускается только как запасной путь.
# Ещё воркеры имеет смысл добавлять только с другими IP (DGIS_PROXY), иначе 2ГИС быстрее
# начнёт показывать капчу.
#
# Память (замерено в этом образе с этими лимитами): kz — обычно 0,6–1 ГБ, самая длинная выдача
# (351–389 страниц кликами) — пик 1,26 ГБ; kz-http — ~100–150 МБ, с запасным Chrome до ~1 ГБ.
# mem_limit — жёсткий потолок: больше контейнер не возьмёт, другие сервисы на сервере не пострадают
# (при упоре в лимит перезапустится только этот воркер, этап продолжится с места остановки).
x-parser: &parser
  build: .
  env_file: .env                  # PG_DSN, PG_SCHEMA, DGIS_PACE, DGIS_PROXY, DGIS_CONCURRENCY
  network_mode: host              # доступ к PostgreSQL на хосте по localhost
  init: true                      # tini: собирает завершившиеся процессы Chrome
  shm_size: "512m"                # Chrome использует /dev/shm
  mem_limit: "2560m"              # жёсткий потолок памяти (запас под длинные выдачи Алматы)
  cpus: "1.5"
  volumes:
    - ./output:/app/output        # CSV и кэш сканов районов

services:
  parser:
    <<: *parser
    restart: "no"

  kz:
    <<: *parser
    command: ["kz", "--captcha-wait", "0", "--worker", "kz-browser", "--stages", "transport,catalog,recheck"]
    restart: unless-stopped

  kz-http:
    <<: *parser
    command: ["kz", "--captcha-wait", "0", "--worker", "kz-http", "--stages", "buildings,details"]
    mem_limit: "1536m"
    cpus: "1.0"
    restart: unless-stopped
